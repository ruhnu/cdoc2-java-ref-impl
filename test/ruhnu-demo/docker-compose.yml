# Postgres, the shares server Liquibase migration and an HTTPS DID host for test/ruhnu-demo/demo.sh.
# The two shares servers run on the host as JVM processes (see demo.sh), so that the DID
# did:web:localhost%3A8444:p:alice resolves the same way for them and for cdoc2-cli.
# DEMO_WORK is the demo's work directory (TLS key and certificate, DID documents).
name: ruhnu-did-demo

services:
  postgres:
    image: postgres:14.17
    environment:
      POSTGRES_DB: cdoc2-shares
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d cdoc2-shares -U postgres" ]
      interval: 2s
      timeout: 5s
      retries: 60

  liquibase:
    # built by demo.sh from cdoc2-shares-server/server-db/src/main/resources/db
    image: ruhnu-demo/cdoc2-shares-server-liquibase:local
    depends_on:
      postgres:
        condition: service_healthy
    command: --url="jdbc:postgresql://postgres:5432/cdoc2-shares?user=postgres&password=secret" --defaultsFile=liquibase.properties update

  did-host:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8444:8444"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DEMO_WORK:?set DEMO_WORK}/did-host-tls:/etc/nginx/tls:ro
      - ${DEMO_WORK:?set DEMO_WORK}/did-docs:/usr/share/nginx/html:ro
